receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  # en premier : /otlp/ est public
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch: {}
  # aucune donnée personnelle dans Jaeger
  attributes/sante:
    actions:
      - {key: enduser.id, action: delete}
      - {key: user.email, action: delete}
      - {key: user.name, action: delete}
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.cookie, action: delete}
      # l'agent Java garde la chaîne de requête (saisies) dans url.query
      - {key: url.query, action: delete}
      - {key: http.target, action: delete}
      - {pattern: "(?i).*(email|password|motif)$", action: delete}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
  debug: {verbosity: basic}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sante, batch]
      exporters: [otlp/jaeger, debug]
