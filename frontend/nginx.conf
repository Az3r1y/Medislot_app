# Ni chaîne de requête ni adresse IP dans le journal : la position et les saisies n'y arrivent jamais.
log_format sans_requete '[$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

# Limites par adresse IP, 429 au-delà. Seuil large pour auth : une classe peut partager une IP.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
# traces du navigateur (un envoi toutes les 5 s environ par onglet)
limit_req_zone $binary_remote_addr zone=otlp:10m rate=2r/s;
# connexions simultanées vers l'API, flux SSE compris
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
 # image non root : port supérieur à 1024
 listen 8080;
 server_tokens off;
 access_log /var/log/nginx/access.log sans_requete;
 root /usr/share/nginx/html;

 # Résolution DNS à chaque requête : Nginx démarre même si le back est arrêté.
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $backend http://backend:8080;
 set $collector collector:4318;

 # Page : l'API envoie ses propres en-têtes (Spring Security).
 location / {
  try_files $uri $uri/ /index.html;
  # Tiers autorisés : géocodage IGN et tuiles OpenStreetMap.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://data.geopf.fr; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
  # Ignoré par les navigateurs en HTTP, actif dès que le site passe en HTTPS.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
 }

 # Fichiers cachés (.env, .git…) et source maps : 404, comme une page inexistante.
 location ~ /\. { return 404; }
 location ~ \.map$ { return 404; }

 # Back arrêté : erreur JSON neutre au lieu de la page HTML de Nginx.
 location @api_down {
  default_type application/problem+json;
  return 503 '{"title":"Service momentanément indisponible","status":503}';
 }

 # Traces du navigateur. Avec une variable, proxy_pass garde le chemin : le rewrite retire /otlp.
 location /otlp/ {
  limit_req zone=otlp burst=20 nodelay;
  rewrite ^/otlp/(.*)$ /$1 break;
  proxy_pass http://$collector;
  proxy_connect_timeout 3s;
  client_max_body_size 1m;
 }

 location /api/ {
  limit_conn conn 20;
  proxy_pass $backend;
  # back arrêté : 502 immédiat plutôt qu'une attente de 60 s
  proxy_connect_timeout 3s;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 150s;
  client_max_body_size 64k;
  # Le back ne doit pas trahir sa technologie, même par erreur.
  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;
  # Seulement les erreurs de Nginx (back injoignable) : les 5xx du back passent tels quels.
  error_page 502 504 = @api_down;

  # 20 essais d'affilée, puis un toutes les 2 s
  location = /api/login { limit_req zone=auth burst=20 nodelay; proxy_pass $backend; }
  location ^~ /api/oauth2/ { limit_req zone=auth burst=20 nodelay; proxy_pass $backend; }
  location ^~ /api/login/oauth2/ { limit_req zone=auth burst=20 nodelay; proxy_pass $backend; }
  location = /api/register { limit_req zone=auth burst=20 nodelay; proxy_pass $backend; }
  location = /api/platform/login { limit_req zone=auth burst=20 nodelay; proxy_pass $backend; }
  # Logo d'un cabinet : 200 Ko au plus, vérifié aussi par le back.
  location ~ ^/api/platform/clinics/[a-z0-9-]+/logo$ { client_max_body_size 256k; proxy_pass $backend; }
  # Les erreurs de proxy contiennent normalement l'URL complète, jeton compris.
  location = /api/calendar/feed.ics { error_log /dev/null; proxy_pass $backend; }
 }
}
