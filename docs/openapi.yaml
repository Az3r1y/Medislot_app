  "components": {
    "schemas": {
      "Professional": {
        "type": "object",
        "required": [
          "id",
          "name",
          "specialty",
          "city",
          "address",
          "bio",
          "fee"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "specialty": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "bio": {
            "type": "string"
          },
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "fee": {
            "type": "integer",
            "minimum": 0
          },
          "latitude": {
            "type": [
              "number",
              "null"
            ],
            "description": "Position du cabinet (WGS 84)"
          },
          "longitude": {
            "type": [
              "number",
              "null"
            ],
            "description": "Position du cabinet (WGS 84)"
          },
          "distanceKm": {
            "type": [
              "number",
              "null"
            ],
            "description": "Distance à vol d'oiseau depuis lat/lon, au dixième de km. null hors mode « Autour de moi »."
          }
        }
      },
      "Slot": {
        "type": "object",
        "required": [
          "id",
          "professionalId",
          "startsAt",
          "endsAt"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "professionalId": {
            "type": "integer"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "BookingRequest": {
        "type": "object",
        "required": [
          "slotId"
        ],
        "properties": {
          "slotId": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "Appointment": {
        "type": "object",
        "required": [
          "id",
          "slotId",
          "professionalId",
          "professionalName",
          "status",
          "startsAt",
          "endsAt"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "slotId": {
            "type": "integer"
          },
          "professionalId": {
            "type": "integer"
          },
          "professionalName": {
            "type": "string"
          },
          "specialty": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "CONFIRMED",
              "CANCELLED"
            ]
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Identity": {
        "type": "object",
        "required": [
          "id",
          "name",
          "email",
          "role"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "role": {
            "type": "string"
          }
        }
      },
      "Problem": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "errors": {
            "type": "array",
            "items": {
              "type": "object"
            }
          }
        }
      },
      "Notification": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "message": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "History": {
        "type": "object",
        "properties": {
          "action": {
            "type": "string",
            "enum": [
              "CREATED",
              "RESCHEDULED",
              "CANCELLED"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
    },
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "JSESSIONID"
      }
    }
  }
}
