{
  "openapi": "3.1.0",
  "info": {
    "title": "MediSlot",
    "version": "1.0.0",
    "description": "Contrat de la correction pédagogique. Session HttpOnly et CSRF pour les écritures. Données fictives."
  },
  "servers": [
    {
      "url": "http://localhost:8088/api"
    }
  ],
  "paths": {
    "/professionals": {
      "get": {
        "summary": "Rechercher et paginer les professionnels",
        "responses": {
          "200": {
            "description": "Réponse réussie",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "items",
                    "page",
                    "size",
                    "total"
                  ],
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Professional"
                      }
                    },
                    "page": {
                      "type": "integer"
                    },
                    "size": {
                      "type": "integer"
                    },
                    "total": {
                      "type": "integer"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Données invalides",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "Cabinet inconnu, accès non autorisé ou ressource absente du cabinet."
          }
        },
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "city",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "specialty",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50,
              "default": 6
            }
          },
          {
            "name": "lat",
            "in": "query",
            "description": "Latitude WGS 84 en degrés décimaux, entre -90 et 90. Avec lon : mode « Autour de moi », trié par distance (city et q ignorés). Arrondie par le front à 3 décimales (~110 m). Jamais enregistrée ni journalisée.",
            "schema": {
              "type": "number",
              "minimum": -90,
              "maximum": 90
            }
          },
          {
            "name": "lon",
            "in": "query",
            "description": "Longitude WGS 84 en degrés décimaux, entre -180 et 180. Obligatoire avec lat.",
            "schema": {
              "type": "number",
              "minimum": -180,
              "maximum": 180
            }
          },
          {
            "name": "radiusKm",
            "in": "query",
            "description": "Rayon en kilomètres, à vol d'oiseau, entre 0,1 et 50.",
            "schema": {
              "type": "number",
              "minimum": 0.1,
              "maximum": 50,
              "default": 5
            }
          },
          {
            "name": "X-Clinic",
            "in": "header",
            "required": true,
            "description": "Slug du cabinet courant. Obligatoire, sauf pour SSE qui accepte aussi le paramètre clinic.",
            "schema": {
              "type": "string",
              "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
              "maxLength": 63
            }
          }
        ],
        "description": "Sans lat/lon : recherche par nom, ville et spécialité, triée par nom. Avec lat/lon : praticiens dans le cercle de radiusKm, du plus proche au plus loin (puis par nom, puis id), paginés après le tri. Refus en 400, dans l'ordre : position incomplète, latitude, longitude, rayon, pagination ; type invalide (lat=abc) : « Paramètre invalide : lat. »"
      }
    },
