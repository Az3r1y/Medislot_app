    "/appointments/{id}/convocation.pdf": {
      "get": {
        "summary": "Télécharger sa convocation (PDF)",
        "description": "Fabriquée par le serveur à chaque appel, jamais mise en cache. Droits vérifiés avant toute fabrication : le rendez-vous d'un autre patient répond 404 (son existence n'est pas révélée).",
        "parameters": [
          {
            "name": "download",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "default": false
            },
            "description": "false : Content-Disposition inline (affichage dans un onglet). true : attachment (enregistrement)."
          },
          {
            "name": "X-Clinic",
            "in": "header",
            "required": true,
            "description": "Slug du cabinet courant. Obligatoire, sauf pour SSE qui accepte aussi le paramètre clinic.",
            "schema": {
              "type": "string",
              "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
              "maxLength": 63
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Convocation au format PDF/UA, polices embarquées, heure de Paris.",
            "headers": {
              "Content-Disposition": {
                "description": "inline (ou attachment si download=true) ; filename=\"convocation-{id}.pdf\" : le numéro seul, ni nom, ni spécialité, ni date.",
                "schema": {
                  "type": "string",
                  "example": "inline; filename=\"convocation-12.pdf\""
                }
              },
              "Cache-Control": {
                "description": "Document personnel : aucun cache, ni navigateur ni proxy.",
                "schema": {
                  "type": "string",
                  "example": "no-store"
                }
              },
              "X-Content-Type-Options": {
                "description": "Le navigateur ne devine pas le type.",
                "schema": {
                  "type": "string",
                  "example": "nosniff"
                }
              }
            },
            "content": {
              "application/pdf": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "401": {
            "description": "Session requise",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "Rendez-vous introuvable, ou appartenant à un autre patient",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "Rendez-vous annulé : plus de convocation",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "500": {
            "description": "Fabrication du PDF impossible",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "400": {
            "description": "Cabinet manquant ou invalide."
          }
        },
        "security": [
          {
            "session": []
          }
        ]
      },
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "minimum": 1
          }
        }
      ]
    },
